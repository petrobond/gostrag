name: ci

on:
  push:
    branches: ["release/**"]
  pull_request:
    branches: ["release/**"]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gostrag
          POSTGRES_PASSWORD: gostrag
          POSTGRES_DB: gostrag_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U gostrag -d gostrag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgresql://gostrag:gostrag@127.0.0.1:5432/gostrag_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app bot eval tests
      - name: Pytest
        run: pytest -q tests

  image:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false
          tags: gostrag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
