name: gostrag

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${APP_IMAGE:-gostrag:latest}
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../data/source:/data/source:ro
      - ../data/corpus:/data/corpus:ro
      - ../data/index:/data/index:ro
      - ../data/kb:/data/kb:ro
      - ./reports:/app/reports
      - fastembed_cache:/app/.cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped

  bot:
    image: ${APP_IMAGE:-gostrag:latest}
    command: ["python", "-m", "bot.main"]
    env_file:
      - .env
    volumes:
      - ../data/source:/data/source:ro
      - ../data/corpus:/data/corpus:ro
      - ../data/index:/data/index:ro
      - ../data/kb:/data/kb:ro
      - ./reports:/app/reports
      - fastembed_cache:/app/.cache/fastembed
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    logging: *default-logging
    restart: unless-stopped

  data:
    image: ${APP_IMAGE:-gostrag:latest}
    profiles: ["data"]
    env_file:
      - .env
    healthcheck:
      disable: true
    volumes:
      - ../data/source:/data/source:ro
      - ../data/corpus:/data/corpus
      - ../data/index:/data/index
      - ../data/kb:/data/kb
    depends_on:
      qdrant:
        condition: service_started
    command:
      [
        "python",
        "-m",
        "app.cli",
        "embed",
        "--corpus",
        "/data/corpus",
        "--index",
        "/data/index",
        "--qdrant-url",
        "http://qdrant:6333",
      ]
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    logging: *default-logging
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gostrag
      POSTGRES_PASSWORD: gostrag
      POSTGRES_DB: gostrag
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gostrag -d gostrag"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

volumes:
  qdrant_storage:
  postgres_data:
  redis_data:
  fastembed_cache:

