name: gostrag

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ../data/source:/data/source:ro
      - ../data/corpus:/data/corpus
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "bot.main"]
    env_file:
      - .env
    volumes:
      - ../data/source:/data/source:ro
      - ../data/corpus:/data/corpus
      - ./reports:/app/reports
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gostrag
      POSTGRES_PASSWORD: gostrag
      POSTGRES_DB: gostrag
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gostrag -d gostrag"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  qdrant_storage:
  postgres_data:
  redis_data:
