{% extends "base.html" %}
{% block title %}Смена пароля — gostrag{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Смена пароля</h1>
  <p class="muted">{{ user.email }}</p>
  {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/password" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="current_password">Текущий пароль</label>
    <input id="current_password" type="password" name="current_password"
           autocomplete="current-password" required>
    <label for="new_password">Новый пароль</label>
    <input id="new_password" type="password" name="new_password" autocomplete="new-password"
           minlength="12" required>
    <label for="confirm_password">Повторите новый пароль</label>
    <input id="confirm_password" type="password" name="confirm_password"
           autocomplete="new-password" minlength="12" required>
    <button type="submit" class="primary">Сохранить</button>
  </form>
  <p class="muted small">После смены пароля остальные сессии будут завершены.</p>
</section>
{% endblock %}
