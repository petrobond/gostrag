<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}gostrag{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v={{ app_version }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% if user %}
  <header class="topbar">
    <a class="brand" href="/chat">gostrag</a>
    <nav class="topnav">
      <a href="/chat">Чат</a>
      {% if user.role == 'admin' %}<a href="/admin">Админ</a>{% endif %}
      <a href="/password">Пароль</a>
    </nav>
    <div class="who">
      <span class="email" title="{{ user.email }}">{{ user.email }}</span>
      <span class="badge">{{ 'админ' if user.role == 'admin' else 'пользователь' }}</span>
      <form method="post" action="/logout" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="link-button">Выйти</button>
      </form>
    </div>
  </header>
  {% endif %}
  <main class="{% block main_class %}page{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js?v={{ app_version }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
