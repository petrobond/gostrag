[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gostrag"
version = "3.2.0"
description = "RAG over Russian AI standards (GOST R / PNST) with GigaChat"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "openai>=1.54",
    "asyncpg>=0.30",
    "redis>=5.2",
    "qdrant-client>=1.12,<1.13",
    "aiogram>=3.15",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "boto3>=1.35",
    "pymorphy3>=2.0",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0",
    "tenacity>=9.0",
    "structlog>=24.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
local = [
    "fastembed>=0.9",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools]
packages = ["app", "bot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
