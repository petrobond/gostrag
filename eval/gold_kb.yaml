- id: KB01
  category: definition
  question: Что такое граф знаний по ГОСТ Р 71540—2024?
  expected_answer: 'граф знаний (knowledge graph): Графическое представление структурированных
    знаний о понятиях и отношениях между ними. Примечания 1 Граф знаний может содержать
    онтологию и данные, относящиеся к онтологии. 2 Граф знаний может быть представлен
    в виде набора триплетов, где каждый триплет (голова, хвост, связь) обозначает
    тот факт, что связь существует между головной сущностью и хвостовой сущностью.'
  expected_sources:
  - ГОСТ Р 71540—2024, п. 3.7
  expect_refusal: false
- id: KB02
  category: definition
  question: Что такое машинное обучение по ПНСТ 965—2024?
  expected_answer: 'машинное обучение (machine learning): Процесс оптимизации параметров
    модели (3.3.8) с помощью вычислительных методов таким образом, чтобы поведение
    модели (3.1.23) отражало данные и/или опыт. [ГОСТ Р 71476—2024, статья 3.3.5]'
  expected_sources:
  - ПНСТ 965—2024, п. 3.10
  expect_refusal: false
- id: KB03
  category: definition
  question: Что такое искусственный интеллект по ГОСТ Р 59277—2020?
  expected_answer: "искусственный интеллект (artificial intelligence): Комплекс технологических\
    \ решений, позволяющий имитировать когнитивные функции человека (включая самообучение,\
    \ поиск решений без заранее заданного алгоритма и достижение инсайта) и получать\
    \ при выполнении конкретных практически значимых задач обработки данных результаты,\
    \ сопоставимые, как минимум, с результатами интеллектуальной деятельности человека.\
    \ Примечани \x03е — Комплекс технологических решений включает в себя информационно-коммуникационную\
    \ и"
  expected_sources:
  - ГОСТ Р 59277—2020, п. 3.18
  expect_refusal: false
- id: KB04
  category: definition
  question: Что такое качество данных по ПНСТ 1046—2026?
  expected_answer: 'качество данных (data quality): Степень, с которой набор характеристик,
    присущих данным, отвечает требованиям. [ГОСТ Р ИСО 8000-2—2019, статья 3.8.1]'
  expected_sources:
  - ПНСТ 1046—2026, п. 3.17
  expect_refusal: false
